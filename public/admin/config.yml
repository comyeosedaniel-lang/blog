backend:
  name: github
  repo: comyeosedaniel-lang/blog
  branch: main
  base_url: https://mylineal-cms-auth.comyeosedaniel.workers.dev
  auth_endpoint: auth

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog_ko"
    label: "블로그 (한국어)"
    folder: "src/content/blog/ko"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "제목", name: "title", widget: "string" }
      - { label: "설명", name: "description", widget: "text" }
      - { label: "작성일", name: "pubDate", widget: "datetime" }
      - { label: "수정일", name: "updatedDate", widget: "datetime", required: false }
      - label: "카테고리"
        name: "category"
        widget: "select"
        default: "life"
        options:
          - { label: "개발 이야기", value: "dev" }
          - { label: "책 이야기", value: "book" }
          - { label: "나의 이야기", value: "life" }
          - { label: "우리의 이야기", value: "us" }
      - { label: "태그", name: "tags", widget: "list", required: false }
      - { label: "임시저장", name: "draft", widget: "boolean", default: false }
      - { label: "본문", name: "body", widget: "markdown" }

  - name: "blog_en"
    label: "Blog (English)"
    folder: "src/content/blog/en"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Published", name: "pubDate", widget: "datetime" }
      - { label: "Updated", name: "updatedDate", widget: "datetime", required: false }
      - label: "Category"
        name: "category"
        widget: "select"
        default: "life"
        options:
          - { label: "Dev Stories", value: "dev" }
          - { label: "Book Stories", value: "book" }
          - { label: "My Story", value: "life" }
          - { label: "Our Story", value: "us" }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }
